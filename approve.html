<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOSCA-3 PL — Zatwierdź wniosek</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f5f0e8;
      --warm-white: #faf8f4;
      --ink: #1a1610;
      --ink-light: #3d3830;
      --muted: #7a7265;
      --border: #d4cfc6;
      --accent: #8b3a2a;
      --gold: #b8923a;
      --green: #2a6b3a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'EB Garamond', Georgia, serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      max-width: 520px;
      width: 100%;
      padding: 2.5rem;
    }

    .badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      display: inline-block;
      padding: 0.2rem 0.5rem;
      margin-bottom: 1.2rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      line-height: 1.3;
    }

    .info-grid {
      display: grid;
      gap: 0.6rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      padding: 1.2rem;
      background: var(--cream);
    }

    .info-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .info-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding-top: 0.1rem;
    }

    .info-value {
      color: var(--ink);
      word-break: break-word;
    }

    .code-display {
      background: var(--ink);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 1.4rem;
      letter-spacing: 0.2em;
      text-align: center;
      padding: 1rem;
      margin-bottom: 2rem;
    }

    .btn-approve {
      width: 100%;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 1rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 0.8rem;
    }

    .btn-approve:hover { opacity: 0.88; }
    .btn-approve:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }

    .btn-reject {
      width: 100%;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.7rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-reject:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .status {
      display: none;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.95rem;
    }

    .status.success { color: var(--green); }
    .status.error   { color: var(--accent); }

    .note {
      font-size: 0.78rem;
      color: var(--muted);
      font-style: italic;
      text-align: center;
      margin-top: 1.5rem;
      line-height: 1.6;
    }

    .error-page {
      text-align: center;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card" id="main-card">
    <div class="badge">Panel administratora</div>
    <h1>Zatwierdź wniosek o dostęp</h1>

    <div class="info-grid" id="info-grid">
      <!-- wypełniane przez JS -->
    </div>

    <div class="info-label" style="margin-bottom: 0.5rem;">Kod który zostanie wysłany</div>
    <div class="code-display">TOSCA-2026</div>

    <button class="btn-approve" id="btn-approve" onclick="sendCode()">
      ✓ Wyślij kod dostępu do wnioskodawcy
    </button>
    <button class="btn-reject" onclick="rejectRequest()">
      ✗ Odrzuć wniosek (nie wysyłaj kodu)
    </button>

    <div class="status" id="status-msg"></div>

    <div class="note">
      Kod <strong>TOSCA-2026</strong> zostanie wysłany na adres e-mail wnioskodawcy.<br>
      Ta strona działa tylko z linku w mailu z wnioskiem.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    const EMAILJS_SERVICE_ID        = 'service_dmwyowc';
    const EMAILJS_TEMPLATE_APPROVAL = 'template_3ial2dc';
    const EMAILJS_PUBLIC_KEY        = 'abYqW-rUvxEAPMD6S';
    const ACCESS_CODE               = 'TOSCA-2026';

    emailjs.init(EMAILJS_PUBLIC_KEY);

    // Odczytaj dane z URL
    const params = new URLSearchParams(window.location.search);
    const fname       = params.get('fname') || '';
    const lname       = params.get('lname') || '';
    const email       = params.get('email') || '';
    const affiliation = params.get('affiliation') || '';
    const status      = params.get('status') || '';
    const purpose     = params.get('purpose') || '';

    // Jeśli brak emaila — błąd
    if (!email) {
      document.getElementById('main-card').innerHTML = `
        <div class="error-page">
          <p style="font-size:1.1rem; margin-bottom:0.5rem;">Nieprawidłowy link.</p>
          <p style="font-size:0.85rem; color:var(--muted);">Ta strona działa tylko z linku zawartego w mailu z wnioskiem.</p>
        </div>`;
    } else {
      // Wypełnij tabelkę danymi
      const grid = document.getElementById('info-grid');
      const rows = [
        ['Imię i nazwisko', `${fname} ${lname}`],
        ['E-mail', email],
        ['Afiliacja', affiliation],
        ['Status', status],
        ['Cel', purpose],
      ];
      grid.innerHTML = rows.map(([label, val]) => `
        <div class="info-row">
          <div class="info-label">${label}</div>
          <div class="info-value">${val}</div>
        </div>
      `).join('');
    }

    async function sendCode() {
      const btn = document.getElementById('btn-approve');
      btn.disabled    = true;
      btn.textContent = 'Wysyłanie...';

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_APPROVAL, {
          to_email:    email,
          fname:       fname,
          lname:       lname,
          access_code: ACCESS_CODE,
        });

        showStatus('✓ Kod wysłany pomyślnie na adres ' + email, 'success');
        btn.textContent = '✓ Wysłano';
      } catch (err) {
        console.error(err);
        showStatus('Błąd wysyłki: ' + (err.text || err.message || 'nieznany błąd'), 'error');
        btn.disabled    = false;
        btn.textContent = '✓ Wyślij kod dostępu do wnioskodawcy';
      }
    }

    function rejectRequest() {
      showStatus('Wniosek odrzucony — żaden mail nie został wysłany.', 'error');
      document.getElementById('btn-approve').disabled = true;
    }

    function showStatus(msg, type) {
      const el      = document.getElementById('status-msg');
      el.textContent = msg;
      el.className   = 'status ' + type;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
